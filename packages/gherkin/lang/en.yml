version: 2
locale: en

# Core language spec identity — dialects declare compatibility against these
# (component.yml: language.base / language.baseVersion). Bump specVersion on
# ANY step-pattern change: minor for additions, major for changed or removed
# patterns. Feature files tagged `@lang:itb-core-en@^1` load lang/en-1.yml,
# the previous generation, unchanged.
id: itb-core-en
specVersion: "2.0.0"

# ====================================================================
# OTB Gherkin — core language, generation 2
# ====================================================================
#
# One grammar. Six sentence shapes. Dialects add verbs, actor kinds and value
# types; they never add sentence shapes.
#
#   1. Declaration   <Actor> is the system under test | is infrastructure
#                    <Actor> is a <kind> at "http://…"
#   2. Action        <Actor> <verb> [$value] [on|to <Actor>] [with …] [as $out]
#   3. Assertion     $value [at "path"] should [not] <comparator> [value]
#   4. Conformance   $value should conform to "canonical" [on <Actor>] [ignoring …]
#   5. Binding       set $x to …  |  extract "path" from $y as $x
#   6. Interaction   <Actor> is informed "…" | is asked for $x | uploads a file as $x
#
# Lexical rules
#   Actor        bare PascalCase identifier               FHIRValidator
#   Variable     $name (write) / $name or $a.b.c (read)   $bundle, $response.status
#   Literal      "text", 200, true/false                  quotes optional for numbers
#
# Well-known references (see `refs:`)
#   $response.status  $response.body  $received.method  $received.body
#   $validation.errors  $validation.warnings  $validation.outcome
#
# Step entries are written as typed TEXT, not regex:
#   {actor} {actor:kind} {var} {ref} {value} {string} {path} {url} {canonical}
#   {int} {word} {kind} {type}   ( optional part )?   a/b alternatives
# In the action templates, $N is the slot's TDL expression, $N.raw its text,
# $$N is "$" + text, and $opt.<name> reads a `| option | value |` table row.
# ====================================================================

refs:
  response: '$lastRequest{response}{body}'
  response.status: '$lastRequest{response}{status}'
  response.body: '$lastRequest{response}{body}'
  response.headers: '$lastRequest{response}{headers}'
  received: '$lastReceived'
  validation.errors: '$validationErrors'
  validation.warnings: '$validationWarnings'
  validation.outcome: '$validationOutcome'
  validation.severity: '$validationSeverity'

# Path languages the core can evaluate without a dialect. A path that starts
# with "/" is always a JSON pointer, whatever the subject's type; any other
# path is handed to the subject type's evaluator (FHIRPath for a FHIR
# resource, an X.509 fact path for a certificate, …).
pathEvaluators:
  json-pointer:
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: '$pathVar'
          inputs: { content: '$subject', pointer: '"$path"' }

verbs:
  # ==================================================================
  # 1. DECLARATIONS
  # ==================================================================
  # Roles map to GITB TDL: SUT → role="SUT", everything else → role="SIMULATED".
  # A kind is a component id (fhir-validator, hcert-decoder, …); it tells the
  # parser which dialect's steps an actor can serve, so a step can say
  # `on {actor:fhir-validator}` — or leave the target out when only one
  # actor of that kind is declared.

  - text: '{actor} is the system under test( at {url})?( as defined by {canonical})?'
    doc: Declare the actor whose conformance this test measures.
    actions:
      - declareActor: { id: '$1', role: 'SUT', endpoint: '$2', canonical: '$3' }
      - assign: { to: '$1Base', value: '"$2"' }
        when: '$2'

  - text: '{actor} is infrastructure( at {url})?( as defined by {canonical})?'
    doc: Declare a supporting actor (mock, simulator, peer) that is not measured.
    actions:
      - declareActor: { id: '$1', role: 'infra', endpoint: '$2', canonical: '$3' }
      - assign: { to: '$1Base', value: '"$2"' }
        when: '$2'

  - text: '{actor} is available( as {string})?( at {url})?( as defined by {canonical})?'
    doc: Same as "is infrastructure"; kept because many features read better with it.
    actions:
      - declareActor: { id: '$1', role: 'infra', name: '$2', endpoint: '$3', canonical: '$4' }
      - assign: { to: '$1Base', value: '"$3"' }
        when: '$3'

  - text: '{actor} is a/an {kind}( at {url})?( as defined by {canonical})?'
    doc: Declare a supporting actor of a dialect kind, e.g. "FHIRValidator is a fhir-validator at …".
    actions:
      - declareActor: { id: '$1', role: 'infra', kind: '$2', endpoint: '$3', canonical: '$4' }
      - assign: { to: '$1Base', value: '"$3"' }
        when: '$3'

  # Records the binding only; nothing loads the pool yet (needs a generator-side handler).
  - text: '{actor} is configured with data pool {string}'
    doc: Bind a named sample-data pool to an actor.
    actions:
      - declareVariable: { name: '$1DataPool', varType: 'string', value: '$2' }

  # ==================================================================
  # 1b. ESCAPE TO RAW ITB (scriptlets)
  # ==================================================================
  #   call scriptlet "id"
  #   call scriptlet "id" as $result
  #   call scriptlet "id" with:            | name | value |  (+ optional """ body """)
  # Resolved via the `# itb:` header, then scriptlets/ beside the features,
  # then the enabled components. An id that resolves nowhere is an error.
  - text: 'call scriptlet {string}( as {var})?( with:)?'
    doc: Run a GITB scriptlet holding raw TDL; a doc string supplies the body inline.
    actions:
      - call:
          path: 'scriptlets/$1.xml'
          output: '$2'
          inputsFromTable: true
          body: '$docString'

  # ==================================================================
  # 2. HTTP — the raw transport, between actors
  # ==================================================================
  # These do NOT assert the status: for a raw exchange the status IS the
  # thing under test. Assert it: `Then $response.status should be 201`.
  # Dialect verbs (loads IG, decodes, …) DO assert their own success.
  #
  #   <Actor> posts/puts/patches to <Actor> at "/path" [with id $id | "literal"] with: """…"""
  #   <Actor> posts/puts/patches to <Actor> at "/path" [with id $id] with body $var
  #   <Actor> gets from <Actor> at "/path" [with id $id] as $var
  #   <Actor> gets "https://…" as $var
  #   <Actor> deletes on <Actor> at "/path" [with id $id]
  #   set header "Name" to "value" | to $var
  #   set bearer token from $token
  #
  # `with id $x` appends a run-time value to the path (TDL string literals do
  # not interpolate variables, concat() does). Put the trailing slash in the
  # path; the value is appended verbatim.

  - text: 'set header {string} to {value}'
    doc: Set a request header for every following request (literal or $variable).
    actions:
      - assign: { to: 'jsonHeaders{$1}', value: '$2' }

  - text: 'set bearer token from {ref}'
    doc: Set Authorization to "Bearer <token>" from a variable.
    actions:
      - assign: { to: 'jsonHeaders{Authorization}', value: 'concat("Bearer ", $1)' }

  - text: '{actor} posts to/on {actor} at {string}( with id {value})? with body {ref}'
    doc: POST a body held in a variable.
    actions:
      - assign: { to: 'jsonHeaders{Content-Type}', value: '"application/json"' }
      - assign: { to: 'jsonHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'lastRequest'
          desc: 'POST $3'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$2'
          inputs:
            uri: 'concat($$2Base, "$3", $4)'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$5'

  - text: '{actor} posts to/on {actor} at {string}( with id {value})? with:'
    doc: POST the doc string as the body.
    actions:
      - assign: { to: 'jsonHeaders{Content-Type}', value: '"application/json"' }
      - assign: { to: 'jsonHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'lastRequest'
          desc: 'POST $3'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$2'
          inputs:
            uri: 'concat($$2Base, "$3", $4)'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$docString'

  - text: '{actor} puts to/on {actor} at {string}( with id {value})? with body {ref}'
    doc: PUT a body held in a variable.
    actions:
      - assign: { to: 'jsonHeaders{Content-Type}', value: '"application/json"' }
      - assign: { to: 'jsonHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'lastRequest'
          desc: 'PUT $3'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$2'
          inputs:
            uri: 'concat($$2Base, "$3", $4)'
            method: '"PUT"'
            headers: '$jsonHeaders'
            body: '$5'

  - text: '{actor} puts to/on {actor} at {string}( with id {value})? with:'
    doc: PUT the doc string as the body.
    actions:
      - assign: { to: 'jsonHeaders{Content-Type}', value: '"application/json"' }
      - assign: { to: 'jsonHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'lastRequest'
          desc: 'PUT $3'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$2'
          inputs:
            uri: 'concat($$2Base, "$3", $4)'
            method: '"PUT"'
            headers: '$jsonHeaders'
            body: '$docString'

  - text: '{actor} patches to/on {actor} at {string}( with id {value})? with body {ref}'
    doc: PATCH (JSON Patch) with a body held in a variable.
    actions:
      - assign: { to: 'jsonHeaders{Content-Type}', value: '"application/json-patch+json"' }
      - assign: { to: 'jsonHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'lastRequest'
          desc: 'PATCH $3'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$2'
          inputs:
            uri: 'concat($$2Base, "$3", $4)'
            method: '"PATCH"'
            headers: '$jsonHeaders'
            body: '$5'

  - text: '{actor} patches to/on {actor} at {string}( with id {value})? with:'
    doc: PATCH (JSON Patch) with the doc string as the body.
    actions:
      - assign: { to: 'jsonHeaders{Content-Type}', value: '"application/json-patch+json"' }
      - assign: { to: 'jsonHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'lastRequest'
          desc: 'PATCH $3'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$2'
          inputs:
            uri: 'concat($$2Base, "$3", $4)'
            method: '"PATCH"'
            headers: '$jsonHeaders'
            body: '$docString'

  - text: '{actor} deletes on/from {actor} at {string}( with id {value})?'
    doc: DELETE.
    actions:
      - assign: { to: 'jsonHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'lastRequest'
          desc: 'DELETE $3'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$2'
          inputs:
            uri: 'concat($$2Base, "$3", $4)'
            method: '"DELETE"'
            headers: '$jsonHeaders'

  - text: '{actor} gets from {actor} at {string}( with id {value})? as {var}'
    doc: GET relative to an actor's endpoint and keep the body.
    actions:
      - assign: { to: 'jsonHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'lastRequest'
          desc: 'GET $3'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$2'
          inputs:
            uri: 'concat($$2Base, "$3", $4)'
            method: '"GET"'
            headers: '$jsonHeaders'
      - assign: { to: '$5', value: '$lastRequest{response}{body}' }

  # Absolute URL, literal at compile time. TDL literals do not interpolate
  # $variables — use `gets from <Actor> at "…"` for actor-relative paths.
  - text: '{actor} gets {string} as {var}'
    doc: GET an absolute URL and keep the body.
    actions:
      - assign: { to: 'jsonHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'lastRequest'
          desc: 'GET $2'
          handler: 'HttpMessagingV2'
          from: '$1'
          inputs:
            uri: '"$2"'
            method: '"GET"'
            headers: '$jsonHeaders'
      - assign: { to: '$3', value: '$lastRequest{response}{body}' }

  # Repeated POST, paced by the operator between sends (this ITB has no sleep).
  - text: '{actor} posts {ref} to {actor} at {string} {value} times, paced manually'
    doc: POST the same body N times, prompting the operator between sends.
    actions:
      - assign: { to: 'jsonHeaders{Content-Type}', value: '"application/json"' }
      - assign: { to: 'jsonHeaders{Accept}', value: '"application/json"' }
      - repeat:
          count: '$5'
          do:
            - send:
                id: 'lastRequest'
                desc: 'POST $4 (loop)'
                handler: 'HttpMessagingV2'
                from: '$1'
                to: '$3'
                inputs:
                  uri: 'concat($$3Base, "$4")'
                  method: '"POST"'
                  headers: '$jsonHeaders'
                  body: '$2'
            - call:
                path: scriptlets/instructUser.xml
                inputs:
                  step: '"inform"'
                  actor: '"$1"'
                  message: '"Dispense in progress — click Continue when the device finishes and is ready for the next request."'

  # ==================================================================
  # 3. BINDING
  # ==================================================================
  #   set $x to "value" | to $y | to 42
  #   set $x to:  """…"""
  #   set $x to now [with format "yyyy-MM-dd"]
  #   extract "/json/pointer" from $y as $x      any value
  #   extract "Patient.name.family" from $y as $x typed value: the type's path language
  #   extract "/json/pointer" as $x               from the last response body

  - text: 'set {var} to now with format {string}'
    doc: Current timestamp in a custom pattern (GITB TokenGenerator).
    actions:
      - process:
          handler: 'TokenGenerator'
          operation: 'timestamp'
          output: '$1'
          inputs: { format: '"$2"' }

  - text: 'set {var} to now'
    doc: Current timestamp as a FHIR instant (yyyy-MM-dd'T'HH:mm:ss.SSSXXX).
    actions:
      - process:
          handler: 'TokenGenerator'
          operation: 'timestamp'
          output: '$1'
          inputs: { format: "\"yyyy-MM-dd'T'HH:mm:ss.SSSXXX\"" }

  - text: 'set {var} to {value}'
    doc: Assign a literal, a number, or another variable.
    actions:
      - assign: { to: '$1', value: '$2' }

  - text: 'set {var} to:'
    doc: Assign the doc string.
    actions:
      - assign: { to: '$1', value: '$docString' }

  - text: 'extract {path} from {ref} as {var}'
    doc: Read a path from a value. "/…" is a JSON pointer; anything else uses the value's type (FHIRPath for a FHIR resource).
    dispatch: path
    pathOutput: 3
    actions: []

  - text: 'extract {path} as {var}'
    doc: Read a JSON pointer from the last response body.
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: '$2'
          inputs: { content: '$lastRequest{response}{body}', pointer: '"$1"' }

  # ==================================================================
  # 4. WAIT, RECEIVE, EXCHANGES — ITB as the peer
  # ==================================================================
  #   <Actor> waits for <Actor> [within N seconds]           catch a request
  #   <Actor> is listening for <Actor>                        open an exchange
  #   <Actor> receives a request from <Actor> [within N seconds]
  #   <Actor> replies to <Actor> with status 200 and: """…""" | and body $var
  #   <Actor> stops listening for <Actor>
  # What was received is $received.method / .path / .headers.X / .body.

  - text: '{actor} waits for {actor} within {int} seconds'
    doc: Wait for any message from an actor, with a timeout.
    actions:
      - receive:
          id: 'lastReceived'
          desc: 'Wait for message'
          handler: 'HttpMessagingV2'
          from: '$2'
          to: '$1'
          inputs: { timeout: '"$3"' }

  - text: '{actor} waits for {actor}'
    doc: Wait for any message from an actor (60 s).
    actions:
      - receive:
          id: 'lastReceived'
          desc: 'Wait for message'
          handler: 'HttpMessagingV2'
          from: '$2'
          to: '$1'
          inputs: { timeout: '"60"' }

  - text: '{actor} is listening for {actor}'
    doc: Open a messaging transaction so a later reply lands on the request's connection.
    actions:
      - btxn: { txnId: 'txn_$1_$2', from: '$2', to: '$1', handler: 'HttpMessagingV2' }

  - text: '{actor} receives a request from {actor} within {int} seconds'
    doc: Receive a request inside an open exchange.
    actions:
      - receive:
          id: 'lastReceived'
          desc: 'Receive from $2'
          handler: 'HttpMessagingV2'
          from: '$2'
          to: '$1'
          txnId: 'txn_$1_$2'
          inputs: { timeout: '"$3"' }

  - text: '{actor} receives a request from {actor}'
    doc: Receive a request inside an open exchange (300 s).
    actions:
      - receive:
          id: 'lastReceived'
          desc: 'Receive from $2'
          handler: 'HttpMessagingV2'
          from: '$2'
          to: '$1'
          txnId: 'txn_$1_$2'
          inputs: { timeout: '"300"' }

  - text: '{actor} replies to {actor} with status {int} and body {ref}'
    doc: Answer the received request with a body held in a variable.
    actions:
      - assign: { to: 'replyHeaders{Content-Type}', value: '"application/json"' }
      - send:
          id: 'lastReply'
          desc: 'Reply $3 to $2'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$2'
          txnId: 'txn_$1_$2'
          inputs:
            status: '"$3"'
            headers: '$replyHeaders'
            body: '$4'

  - text: '{actor} replies to {actor} with status {int} and:'
    doc: Answer the received request with the doc string.
    actions:
      - assign: { to: 'replyHeaders{Content-Type}', value: '"application/json"' }
      - send:
          id: 'lastReply'
          desc: 'Reply $3 to $2'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$2'
          txnId: 'txn_$1_$2'
          inputs:
            status: '"$3"'
            headers: '$replyHeaders'
            body: '$docString'

  - text: '{actor} stops listening for {actor}'
    doc: Close the exchange.
    actions:
      - etxn: { txnId: 'txn_$1_$2' }

  - text: 'wait {value} seconds'
    doc: Pause (logged only — this ITB's TDL has no sleep step).
    actions:
      - wait: { durationMs: '$1 * 1000' }

  # ==================================================================
  # 5. ASSERTIONS
  # ==================================================================
  #   $x should be "v" | $y | 200 | true        $x should not be …
  #   $x should contain "v"                     $x should not contain "v"
  #   $x should be empty | not be empty | exist | not exist
  #   $x should match "regex"
  #   $x should be one of "a, b, c"
  #   $x should be at least 3 | at most 3 | greater than 3 | less than 3
  #   $x should equal $y minus 2
  # Every comparator also takes a path:  $x at "path" should …
  # "/…" is a JSON pointer on any value; other paths use the value's type.

  # Guarded status check: HttpMessagingV2 leaves the status empty when an
  # exchange never completed, and an empty string fed to NumberValidator can
  # surface as an indeterminate step. Default empty → "0" so it fails loudly.
  - text: '$response.status should be {value}'
    doc: Assert the last response status.
    actions:
      - assign:
          to: 'sigStatus'
          value: 'if (empty($lastRequest{response}{status})) then "0" else $lastRequest{response}{status}'
      - verify:
          handler: 'NumberValidator'
          desc: 'Response status is $1.raw'
          inputs:
            actualnumber: '$sigStatus'
            expectednumber: '$1'

  - text: '{ref} should be {value}'
    doc: Equals.
    actions:
      - verify: { handler: 'StringValidator', desc: '$$1 is $2.raw', inputs: { actualstring: '$1', expectedstring: '$2' } }

  - text: '{ref} should not be {value}'
    doc: Not equals.
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 is not $2.raw', inputs: { expression: 'not($1 = $2)' } }

  - text: '{ref} should contain {value}'
    doc: Substring.
    actions:
      - verify: { handler: 'StringValidator', desc: '$$1 contains $2.raw', inputs: { actualstring: '$1', expectedstring: '$2', matchType: '"contains"' } }

  - text: '{ref} should not contain {value}'
    doc: No substring.
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 does not contain $2.raw', inputs: { expression: 'not(contains($1, $2))' } }

  - text: '{ref} should not be empty'
    doc: Non-empty.
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 is not empty', inputs: { expression: 'string-length($1) > 0' } }

  - text: '{ref} should exist'
    doc: Non-empty (alias).
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 exists', inputs: { expression: 'string-length($1) > 0' } }

  - text: '{ref} should be empty'
    doc: Empty.
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 is empty', inputs: { expression: 'string-length($1) = 0' } }

  - text: '{ref} should not exist'
    doc: Empty (alias).
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 does not exist', inputs: { expression: 'string-length($1) = 0' } }

  - text: '{ref} should match {string}'
    doc: Regular expression match.
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 matches "$2"', inputs: { expression: 'matches($1, "$2")' } }

  - text: '{ref} should be one of {string}'
    doc: Membership in a comma-separated list.
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 is one of $2', inputs: { expression: 'contains(concat(",", translate("$2", " ", ""), ","), concat(",", $1, ","))' } }

  - text: '{ref} should be at least {value}'
    doc: Numeric ≥.
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 >= $2.raw', inputs: { expression: 'number($1) >= number($2)' } }

  - text: '{ref} should be at most {value}'
    doc: Numeric ≤.
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 <= $2.raw', inputs: { expression: 'number($1) <= number($2)' } }

  - text: '{ref} should be greater than {value}'
    doc: Numeric >.
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 > $2.raw', inputs: { expression: 'number($1) > number($2)' } }

  - text: '{ref} should be less than {value}'
    doc: Numeric <.
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 < $2.raw', inputs: { expression: 'number($1) < number($2)' } }

  - text: '{ref} should equal {value} minus {value}'
    doc: Numeric lhs = rhs - n.
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 = $2.raw - $3.raw', inputs: { expression: 'number($1) = number($2) - number($3)' } }

  # --- the same, at a path ---------------------------------------------

  - text: '{ref} at {path} should be {value}'
    doc: Equals, at a path.
    dispatch: path
    actions:
      - verify: { handler: 'StringValidator', desc: '$$1 at $2 is $3.raw', inputs: { actualstring: '$pathValue', expectedstring: '$3' } }

  - text: '{ref} at {path} should not be {value}'
    doc: Not equals, at a path.
    dispatch: path
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 at $2 is not $3.raw', inputs: { expression: 'not($pathValue = $3)' } }

  - text: '{ref} at {path} should contain {value}'
    doc: Substring, at a path.
    dispatch: path
    actions:
      - verify: { handler: 'StringValidator', desc: '$$1 at $2 contains $3.raw', inputs: { actualstring: '$pathValue', expectedstring: '$3', matchType: '"contains"' } }

  - text: '{ref} at {path} should not contain {value}'
    doc: No substring, at a path.
    dispatch: path
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 at $2 does not contain $3.raw', inputs: { expression: 'not(contains($pathValue, $3))' } }

  - text: '{ref} at {path} should not be empty'
    doc: Non-empty, at a path.
    dispatch: path
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 at $2 is not empty', inputs: { expression: 'string-length($pathValue) > 0' } }

  - text: '{ref} at {path} should exist'
    doc: Non-empty, at a path (alias).
    dispatch: path
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 at $2 exists', inputs: { expression: 'string-length($pathValue) > 0' } }

  - text: '{ref} at {path} should be empty'
    doc: Empty, at a path.
    dispatch: path
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 at $2 is empty', inputs: { expression: 'string-length($pathValue) = 0' } }

  - text: '{ref} at {path} should not exist'
    doc: Empty, at a path (alias).
    dispatch: path
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 at $2 does not exist', inputs: { expression: 'string-length($pathValue) = 0' } }

  - text: '{ref} at {path} should match {string}'
    doc: Regular expression match, at a path.
    dispatch: path
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 at $2 matches "$3"', inputs: { expression: 'matches($pathValue, "$3")' } }

  - text: '{ref} at {path} should be one of {string}'
    doc: Membership, at a path.
    dispatch: path
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 at $2 is one of $3', inputs: { expression: 'contains(concat(",", translate("$3", " ", ""), ","), concat(",", $pathValue, ","))' } }

  - text: '{ref} at {path} should be at least {value}'
    doc: Numeric ≥, at a path.
    dispatch: path
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 at $2 >= $3.raw', inputs: { expression: 'number($pathValue) >= number($3)' } }

  - text: '{ref} at {path} should be at most {value}'
    doc: Numeric ≤, at a path.
    dispatch: path
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 at $2 <= $3.raw', inputs: { expression: 'number($pathValue) <= number($3)' } }

  - text: '{ref} at {path} should be greater than {value}'
    doc: Numeric >, at a path.
    dispatch: path
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 at $2 > $3.raw', inputs: { expression: 'number($pathValue) > number($3)' } }

  - text: '{ref} at {path} should be less than {value}'
    doc: Numeric <, at a path.
    dispatch: path
    actions:
      - verify: { handler: 'ExpressionValidator', desc: '$$1 at $2 < $3.raw', inputs: { expression: 'number($pathValue) < number($3)' } }

  # ==================================================================
  # 6. CONFORMANCE — dispatched to the dialect that owns the validator
  # ==================================================================
  #   $x should conform to "canonical"
  #   $x should conform to "canonical" on FHIRValidator
  #   $x should conform to "canonical" ignoring slicing errors
  #   $x should conform to "canonical" ignoring errors matching "text"
  #   $x should conform to "canonical" with:   | option | value |
  # Which validator: the named one, else the one owning $x's type, else the
  # only declared actor whose dialect can check conformance.

  # Contract with the dialect handler: it leaves the number of errors that
  # count in $conformanceErrors; the core asserts it here.
  - text: '{ref} should conform to {canonical}( on {actor})? ignoring slicing errors'
    doc: Conformance, not counting slice-matching errors (the common profile-level false positive).
    dispatch: conforms
    bind: { ignore: 'matching slice is required' }
    actions:
      - verify: { handler: 'StringValidator', desc: '$$1 conforms to $2 (ignoring slicing errors)', inputs: { actualstring: '$conformanceErrors', expectedstring: '"0"' } }

  - text: '{ref} should conform to {canonical}( on {actor})?( ignoring errors matching {string})?'
    doc: Conformance to a profile or specification; optionally ignore errors whose text contains a phrase.
    dispatch: conforms
    bind: { ignore: '$4.raw' }
    actions:
      - verify: { handler: 'StringValidator', desc: '$$1 conforms to $2', inputs: { actualstring: '$conformanceErrors', expectedstring: '"0"' } }

  - text: '{ref} should conform to {canonical}( on {actor})? with:'
    doc: Conformance with dialect-specific options from a | option | value | table.
    dispatch: conforms
    bind: { ignore: '$opt.ignore' }
    actions:
      - verify: { handler: 'StringValidator', desc: '$$1 conforms to $2', inputs: { actualstring: '$conformanceErrors', expectedstring: '"0"' } }

  - text: '{ref} should not conform to {canonical}( on {actor})?'
    doc: The value must FAIL conformance (at least one error).
    dispatch: conforms
    bind: { ignore: '' }
    actions:
      - verify: { handler: 'NumberValidator', desc: '$$1 does not conform to $2', inputs: { actualnumber: '$conformanceErrors', expectednumber: '0', operation: '"greater_than"' } }

  # Compile-time typing: give a value a type so path assertions and
  # conformance know which dialect reads it. The names come from the loaded
  # dialects ("FHIR resource", "X.509 certificate", "ArchiMate model", …).
  - text: '{ref} is a/an {type}'
    doc: Declare the type of a value bound by an untyped step (e.g. a raw response body).
    dispatch: type
    actions: []

  # ==================================================================
  # 7. INTERACTION
  # ==================================================================
  #   <Actor> is informed "message" [with $content]
  #   <Actor> is asked for $x [with "prompt"]
  #   <Actor> uploads a file as $x

  # Emits <interact> directly rather than via a scriptlet so `with` can carry
  # the actor id — TDL takes a literal there, not a variable.
  # What ITB shows: `desc` is the step in the diagram and the log, `inputTitle`
  # the popup title (default "Server interaction"), an instruct's `desc` only a
  # label and its content the displayed value. So the message is the step's
  # desc AND the instruct's content (forceDisplay: inline text, not an editor).
  - text: '{actor} is informed {string} with {value}'
    doc: Show a message to the actor's tester, with content (a value or a resource) beneath it.
    actions:
      - interact:
          id: 'inform'
          desc: '$2'
          inputTitle: 'Instruction for $1'
          with: '$1'
          instructions:
            - { desc: 'Instruction', name: 'message', value: '"$2"', forceDisplay: true }
            - { desc: 'Content', name: 'content', value: '$3' }

  - text: '{actor} is informed {string}'
    doc: Show a message to the actor's tester.
    actions:
      - interact:
          id: 'inform'
          desc: '$2'
          inputTitle: 'Instruction for $1'
          with: '$1'
          instructions:
            - { desc: 'Instruction', name: 'message', value: '"$2"', forceDisplay: true }

  - text: '{actor} is asked for {var} with {string}'
    doc: Prompt the tester for a text value.
    actions:
      - declareVariable: { name: '$2', varType: 'string' }
      - interact:
          id: 'ask'
          desc: '$3'
          inputTitle: '$3'
          requests:
            - { desc: '$3', name: '$2', inputType: 'TEXT', required: true, variable: '$$2' }

  - text: '{actor} is asked for {var}'
    doc: Prompt the tester for a text value.
    actions:
      - declareVariable: { name: '$2', varType: 'string' }
      - interact:
          id: 'ask'
          desc: 'Provide input'
          inputTitle: 'Provide input'
          requests:
            - { desc: 'Provide input:', name: '$2', inputType: 'TEXT', required: true, variable: '$$2' }

  - text: '{actor} uploads a file as {var}( with {string})?'
    doc: Prompt the tester to upload a file; the bytes are bound to the variable.
    actions:
      - declareVariable: { name: '$2', varType: 'binary' }
      - interact:
          id: 'upload'
          desc: 'Upload a file'
          with: '$1'
          requests:
            - { desc: 'Upload a file:', name: '$2', inputType: 'UPLOAD', required: true, variable: '$$2' }
        unless: '$3'
      - interact:
          id: 'upload'
          desc: '$3'
          with: '$1'
          requests:
            - { desc: '$3', name: '$2', inputType: 'UPLOAD', required: true, variable: '$$2' }
        when: '$3'

  # Evidence. When an obligation is about what a system SHOWS or DOES (display,
  # handle), the operator demonstrates it and attaches proof — a screenshot, an
  # export, a log — which the test bed keeps in the session report next to the
  # step. One dialog: the instruction, a required file, an optional note.
  - text: '{actor} submits evidence of {string} as {var}'
    doc: One dialog asking the tester to demonstrate something and attach a file as evidence (plus an optional note, in $x_note).
    actions:
      - declareVariable: { name: '$3', varType: 'binary' }
      - declareVariable: { name: '$3_note', varType: 'string', value: '""' }
      - interact:
          id: 'evidence'
          desc: 'Evidence: $2'
          inputTitle: 'Evidence: $2'
          with: '$1'
          instructions:
            - { desc: 'Demonstrate on the system under test: $2. Then attach a screenshot, export or log that shows it.', name: 'instruction', value: '""' }
          requests:
            - { desc: 'Evidence file (screenshot, export or log) for: $2', name: '$3', inputType: 'UPLOAD', required: true, variable: '$$3' }
            - { desc: 'Note (optional): where it is shown, or why it cannot be', name: '$3_note', inputType: 'TEXT', required: false, variable: '$$3_note' }
      - log: 'concat("Evidence submitted for: $2 — note: ", $$3_note)'

  # Checklist. The operator confirms each item of a list in ONE dialog — a
  # Displayed / Not displayed (or Yes / No) choice per row — and every row
  # becomes its own verdict in the report. This is the construct behind every
  # "SHOULD:display" / "SHALL:handle" style obligation, so a dialect never has
  # to invent its own way of asking.
  #
  #   Then Consumer confirms each of these is displayed for "the allergy Penicillin":
  #     | item           | detail  |
  #     | clinicalStatus | active  |
  #     | type           | allergy |
  #
  # `detail` is optional. The word after "is" (displayed, accepted, supported…)
  # names the behaviour in the prompt and in each verdict.
  - text: '{actor} confirms each of these is {word} for {string}:'
    doc: One dialog with a per-row choice; one pass/fail verdict per row (table | item | detail |).
    table:
      required: [item]
    actions:
      - interact:
          id: 'confirm'
          desc: 'For $3: is each of these $2?'
          inputTitle: 'For $3: is each of these $2?'
          with: '$1'
          instructions:
            - { desc: 'For $3, choose for each item below whether it is $2. Leave nothing unanswered.', name: 'instruction', value: '""' }
          requestsFromTable:
            desc: '$row.item — $row.detail'
            name: 'confirmed_$row.__index'
            inputType: 'SELECT_SINGLE'
            required: true
            options: 'yes,no'
            optionLabels: '$2,not $2'
            variable: '$confirmed{$row.__index}'
      - foreach:
          from: '$tableRows'
          do:
            - verify:
                handler: 'StringValidator'
                desc: '$row.item is $2 for $3'
                inputs: { actualstring: '$confirmed{$row.__index}', expectedstring: '"yes"' }

  - text: '{actor} confirms each of these is {word}:'
    doc: Same, without naming what the items belong to.
    table:
      required: [item]
    actions:
      - interact:
          id: 'confirm'
          desc: 'Is each of these $2?'
          inputTitle: 'Is each of these $2?'
          with: '$1'
          instructions:
            - { desc: 'Choose for each item below whether it is $2. Leave nothing unanswered.', name: 'instruction', value: '""' }
          requestsFromTable:
            desc: '$row.item — $row.detail'
            name: 'confirmed_$row.__index'
            inputType: 'SELECT_SINGLE'
            required: true
            options: 'yes,no'
            optionLabels: '$2,not $2'
            variable: '$confirmed{$row.__index}'
      - foreach:
          from: '$tableRows'
          do:
            - verify:
                handler: 'StringValidator'
                desc: '$row.item is $2'
                inputs: { actualstring: '$confirmed{$row.__index}', expectedstring: '"yes"' }

  # ==================================================================
  # 8. LOGGING
  # ==================================================================
  - text: 'log {value}'
    doc: Write to the session log.
    actions:
      - log: '$1'
