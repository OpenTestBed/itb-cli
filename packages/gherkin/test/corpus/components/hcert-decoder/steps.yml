# HCERT Decoder dialect — generation 2
#
# Health-certificate QR handling: image → HC1 string → decoded certificate →
# signature check → SMART Health Link → FHIR content. Every step names what it
# reads and binds what it produces; nothing passes through hidden variables.
#
#   kind   hcert-decoder            "HCertDecoder is a hcert-decoder at …"
#   type   hcert:Certificate        the decoded HC1 (JSON facts; read with "/…" pointers)
#
#   User uploads a file as $qrImage                       (core)
#   User scans $qrImage on HCertDecoder as $qrData
#   User decodes $qrData on HCertDecoder as $hcert
#   User verifies the signature of $hcert on HCertDecoder with: | parameter | value |
#   User extracts metadata from $hcert on HCertDecoder as $meta
#   User extracts the SHL link from $hcert on HCertDecoder as $link
#   User authorizes $link on HCertDecoder with pin $pin as $manifest
#   User fetches the FHIR content of $manifest on HCertDecoder as $bundle
#
# `on HCertDecoder` may be left out when only one hcert-decoder is declared.
id: hcert-decoder
name: HCERT Decoder Steps
language: 2
description: >
  Health certificate QR decoding, COSE signature verification, and
  SMART Health Link (VHL/SHL) authorization and FHIR retrieval.

kinds: [hcert-decoder]

types:
  hcert:Certificate:
    name: health certificate

x-json: &json
  - assign: { to: 'hcertHeaders{Content-Type}', value: '"application/json"' }
  - assign: { to: 'hcertHeaders{Accept}', value: '"application/json"' }

verbs:
  # Image bytes → the QR's text payload (the HC1: string).
  - text: '{actor} scans {ref}( on {actor:hcert-decoder})? as {var}'
    doc: Decode a QR image (binary) into its text payload.
    actions:
      - assign: { to: 'imgPart{name}', value: '"image"' }
      - assign: { to: 'imgPart{contentType}', value: '"image/png"' }
      - assign: { to: 'imgPart{fileName}', value: '"upload.png"' }
      - assign: { to: 'imgPart{content}', value: '$2' }
      - assign: { to: 'sendParts', value: '$imgPart', append: true }
      - assign: { to: 'hcertHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'lastRequest'
          desc: 'Decode QR image $$2'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/decode/image")'
            method: '"POST"'
            parts: '$sendParts'
            headers: '$hcertHeaders'
      - verify:
          handler: 'NumberValidator'
          desc: 'QR image decoded (HTTP 200)'
          inputs: { actualnumber: '$lastRequest{response}{status}', expectednumber: '"200"' }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: '$4', inputs: { content: '$lastRequest{response}{body}', pointer: '"/qr_data"' } }

  # HC1 text → decoded certificate: {cose, payload, hcert, cose._raw…}.
  # include_raw exposes the COSE byte strings the signature check needs; they
  # are read back from the bound value, so no step depends on step order.
  - text: '{actor} decodes {ref}( on {actor:hcert-decoder})? as {var}'
    doc: Decode an HC1 payload into its COSE structure, CWT payload and HCERT claim.
    output: { type: 'hcert:Certificate' }
    actions:
      - assign: { to: 'decodeTplParams{value}', value: '$2' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'decodeBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"qr_data\":\"${value?json_string}\",\"include_raw\":true}'"
            parameters: '$decodeTplParams'
      - *json
      - send:
          id: 'lastRequest'
          desc: 'Decode HC1'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/decode/hcert")'
            method: '"POST"'
            headers: '$hcertHeaders'
            body: '$decodeBody'
      - verify:
          handler: 'NumberValidator'
          desc: 'HC1 decoded (HTTP 200)'
          inputs: { actualnumber: '$lastRequest{response}{status}', expectednumber: '"200"' }
      - assign: { to: '$4', value: '$lastRequest{response}{body}' }

  # Signature check against the GDHCN trust network. Parameters come from the
  # table; every one has a default, so a bare `verifies the signature of $x`
  # checks against the production network.
  - text: '{actor} verifies the signature of {ref}( on {actor:hcert-decoder})?( with:)?'
    doc: Verify the COSE signature of a decoded certificate; parameters via | parameter | value |.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'coseRawProtected', inputs: { content: '$2', pointer: '"/cose/_raw/protected_bstr"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'coseRawPayload',   inputs: { content: '$2', pointer: '"/cose/_raw/payload_bstr"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'coseRawSignature', inputs: { content: '$2', pointer: '"/cose/_raw/signature"' } }
      - assign: { to: 'verifyParams{cose_raw_protected}', value: '$coseRawProtected' }
      - assign: { to: 'verifyParams{cose_raw_payload}', value: '$coseRawPayload' }
      - assign: { to: 'verifyParams{cose_raw_signature}', value: '$coseRawSignature' }
      - foreach:
          from: '$tableRows'
          do:
            - assign: { to: 'verifyParams{$row.parameter}', value: '"$row.value"' }
      - assign:
          to: 'verifyTpl'
          value: >-
            '{"cose_raw":{"protected_bstr":"${cose_raw_protected?json_string}","payload_bstr":"${cose_raw_payload?json_string}","signature":"${cose_raw_signature?json_string}"},"use_gdhcn":${use_gdhcn!"true"},"gdhcn_env":"${gdhcn_env!"prod"}"<#if (domain!"")?has_content>,"domain":"${domain}"</#if>,"participant":"${participant!"-"}","usage":"${usage!"DSC"}","verify_did_proof":${verify_did_proof!"true"},"allow_unverified_trustlist":${allow_unverified_trustlist!"false"},"allow_remote_contexts":${allow_remote_contexts!"true"},"context_dir":"${context_dir!"contexts"}"}'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'verifyBody'
          inputs:
            syntax: '"freemarker"'
            template: '$verifyTpl'
            parameters: '$verifyParams'
      - *json
      - send:
          id: 'lastRequest'
          desc: 'Verify COSE signature of $$2'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/verify/signature")'
            method: '"POST"'
            headers: '$hcertHeaders'
            body: '$verifyBody'
      - verify:
          handler: 'NumberValidator'
          desc: 'Signature verification answered (HTTP 200)'
          inputs: { actualnumber: '$lastRequest{response}{status}', expectednumber: '"200"' }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'signatureValid', inputs: { content: '$lastRequest{response}{body}', pointer: '"/valid"' } }
      - verify:
          handler: 'StringValidator'
          desc: 'Signature of $$2 is valid'
          inputs: { actualstring: '$signatureValid', expectedstring: '"true"' }

  - text: '{actor} extracts metadata from {ref}( on {actor:hcert-decoder})? as {var}'
    doc: Extract issuer, dates and other metadata from a decoded certificate.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'coseVal',    inputs: { content: '$2', pointer: '"/cose"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'payloadVal', inputs: { content: '$2', pointer: '"/payload"' } }
      - assign: { to: 'metaTplParams{cose}', value: '$coseVal' }
      - assign: { to: 'metaTplParams{payload}', value: '$payloadVal' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'metaBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"cose\":${cose},\"payload\":${payload}}'"
            parameters: '$metaTplParams'
      - *json
      - send:
          id: 'lastRequest'
          desc: 'Extract metadata'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/extract/metadata")'
            method: '"POST"'
            headers: '$hcertHeaders'
            body: '$metaBody'
      - verify:
          handler: 'NumberValidator'
          desc: 'Metadata extracted (HTTP 200)'
          inputs: { actualnumber: '$lastRequest{response}{status}', expectednumber: '"200"' }
      - assign: { to: '$4', value: '$lastRequest{response}{body}' }

  - text: '{actor} extracts the SHL link from {ref}( on {actor:hcert-decoder})? as {var}'
    doc: Extract the SMART Health Link URL carried by a decoded certificate.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'hcertVal',   inputs: { content: '$2', pointer: '"/hcert"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'payloadVal', inputs: { content: '$2', pointer: '"/payload"' } }
      - assign: { to: 'refTplParams{hcert}', value: '$hcertVal' }
      - assign: { to: 'refTplParams{payload}', value: '$payloadVal' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'refBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"hcert\":${hcert},\"payload\":${payload}}'"
            parameters: '$refTplParams'
      - *json
      - send:
          id: 'lastRequest'
          desc: 'Extract SHL reference'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/extract/reference")'
            method: '"POST"'
            headers: '$hcertHeaders'
            body: '$refBody'
      - verify:
          handler: 'NumberValidator'
          desc: 'SHL reference extracted (HTTP 200)'
          inputs: { actualnumber: '$lastRequest{response}{status}', expectednumber: '"200"' }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: '$4', inputs: { content: '$lastRequest{response}{body}', pointer: '"/url"' } }

  # Authorize the link with a PIN; binds the manifest.
  - text: '{actor} authorizes {ref}( on {actor:hcert-decoder})? with pin {value} as {var}'
    doc: Authorize a SMART Health Link with a PIN and bind the manifest.
    actions:
      - assign: { to: 'authParams{url}', value: '$2' }
      - assign: { to: 'authParams{pin}', value: '$4' }
      - assign:
          to: 'authTpl'
          # ?json_string does the escaping FreeMarker is for. A hand-rolled
          # ?replace chain needs backslashes, and ITB refuses a backslash
          # anywhere in an expression (TDL-042), so the suite would not deploy.
          value: '''{"url":"${url?string?json_string}", "pin":"${pin?string?trim?json_string}"}'''
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'authBody'
          inputs:
            syntax: '"freemarker"'
            template: '$authTpl'
            parameters: '$authParams'
      - *json
      - send:
          id: 'lastRequest'
          desc: 'Authorize short link'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/shlink/authorize")'
            method: '"POST"'
            headers: '$hcertHeaders'
            body: '$authBody'
      - verify:
          handler: 'NumberValidator'
          desc: 'Link authorized (HTTP 200)'
          inputs: { actualnumber: '$lastRequest{response}{status}', expectednumber: '"200"' }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: '$5', inputs: { content: '$lastRequest{response}{body}', pointer: '"/manifest"' } }

  # Negative form: the service must answer with the given status (e.g. 401).
  - text: '{actor} authorizes {ref}( on {actor:hcert-decoder})? with pin {value} expecting status {int}'
    doc: Attempt authorization with a (wrong) PIN and assert the refusal status.
    actions:
      - assign: { to: 'authParams{url}', value: '$2' }
      - assign: { to: 'authParams{pin}', value: '$4' }
      - assign:
          to: 'authTpl'
          # ?json_string does the escaping FreeMarker is for. A hand-rolled
          # ?replace chain needs backslashes, and ITB refuses a backslash
          # anywhere in an expression (TDL-042), so the suite would not deploy.
          value: '''{"url":"${url?string?json_string}", "pin":"${pin?string?json_string}"}'''
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'authBody'
          inputs:
            syntax: '"freemarker"'
            template: '$authTpl'
            parameters: '$authParams'
      - *json
      - send:
          id: 'lastRequest'
          desc: 'Authorize short link (expecting $5)'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/shlink/authorize")'
            method: '"POST"'
            headers: '$hcertHeaders'
            body: '$authBody'
      - verify:
          handler: 'NumberValidator'
          desc: 'Authorization refused with HTTP $5'
          inputs: { actualnumber: '$lastRequest{response}{status}', expectednumber: '"$5"' }

  # Manifest → the first FHIR resource it points to.
  # /shlink/fetch-fhir answers 200 even when it could NOT dereference the
  # manifest's file URL ({"found":false,"fhir":[],"errors":[…]}); check
  # `found` here, where the failure happens, rather than three steps later.
  - text: '{actor} fetches the FHIR content of {ref}( on {actor:hcert-decoder})? as {var}'
    doc: Dereference a SHL manifest and bind the first FHIR resource it delivers.
    output: { type: 'fhir:Resource' }
    actions:
      - assign: { to: 'fetchTplParams{manifest}', value: '$2' }
      - assign:
          to: 'fetchTpl'
          value: >-
            '{"manifest": ${manifest?has_content?then(manifest, "null")}}'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'fetchBody'
          inputs:
            syntax: '"freemarker"'
            template: '$fetchTpl'
            parameters: '$fetchTplParams'
      - assign: { to: 'fetchHeaders{Content-Type}', value: '"application/json"' }
      - assign: { to: 'fetchHeaders{Accept}', value: '"application/fhir+json"' }
      - send:
          id: 'lastRequest'
          desc: 'Fetch FHIR via manifest'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/shlink/fetch-fhir")'
            method: '"POST"'
            headers: '$fetchHeaders'
            body: '$fetchBody'
      - verify:
          handler: 'NumberValidator'
          desc: 'Fetch answered (HTTP 200)'
          inputs: { actualnumber: '$lastRequest{response}{status}', expectednumber: '"200"' }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'fhirFound',      inputs: { content: '$lastRequest{response}{body}', pointer: '"/found"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'fhirFetchError', inputs: { content: '$lastRequest{response}{body}', pointer: '"/errors/0"' } }
      - log: 'concat("fetch-fhir: found=", $fhirFound, " firstError=", $fhirFetchError)'
      - verify:
          handler: 'StringValidator'
          desc: 'FHIR content retrieved from the SHL manifest (found=true; false = the manifest file URL could not be dereferenced — see log)'
          inputs: { actualstring: '$fhirFound', expectedstring: '"true"' }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: '$4', inputs: { content: '$lastRequest{response}{body}', pointer: '"/fhir/0/resource"' } }
