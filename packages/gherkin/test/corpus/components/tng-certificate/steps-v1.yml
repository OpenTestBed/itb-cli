# Language extension for the TNG Certificate Governance component
#
# An EXTENSION on itb-core-en. It adds the 23 certificate-governance verbs
# specified in tng-participant-DEV-XXR/tng_certificate_dialect.py and nothing
# else — actor wiring, variable assignment and generic comparisons stay with
# core.
#
# The semantics are the Python dialect's, one definition to one definition. The
# WORDING follows the ITB house conventions instead, so it reads like the other
# dialects here:
#
#   action      <Actor> inspects group "TLS" file "TLS" on <Actor2> as "cert"
#               (cf. `User decodes HC1 on HCertDecoder`), with the endpoint
#               resolved through $$NBase from the actor named in the step
#   assertion   "cert" keyUsage "cRLSign" should be "false"
#               (cf. `"sigValid" should be "true"`)
#
# The loader appends extension steps AFTER core and takes the first match, so
# every pattern here is anchored and carries tokens between the quoted subject
# and `should`. Otherwise core's `"x" should be "y"` would claim the line and
# these steps would be dead code.
#
# Consequence: the canonical feature in tng-participant-DEV-XXR keeps the Python
# dialect's wording; the copy here uses this one. The Python harness cannot run
# the ITB copy, and vice versa. The scenarios and their meaning are identical.
#
# ---------------------------------------------------------------------------
# HOW THE DIALECT'S SEMANTICS MAP ONTO TDL
# ---------------------------------------------------------------------------
# The dialect has four outcomes: PASSED, FAILED, SKIPPED, UNKNOWN. TDL has two
# — a verify passes or it fails. SKIPPED has no TDL equivalent, and scoring it
# as PASSED is the one mistake the dialect documentation calls out: it would
# report that every UPLOAD certificate satisfies every TLS rule.
#
# So a guard is implemented as a SELECTOR, not a filter:
#
#   Python harness   iterate every certificate; a guard that does not match
#                    yields SKIPPED for that certificate.
#   ITB (here)       the guard step ASKS /inspect for the certificates it
#                    describes. Nothing that fails the guard is ever bound, so
#                    nothing needs skipping.
#
# Unguarded scenarios — the ones that apply to every certificate — iterate with
# foreach over the certificates[] array instead.
#
# ---------------------------------------------------------------------------
# STATE
# ---------------------------------------------------------------------------
#   $tngCountry     participant ISO-3166 alpha-3. Set it in the test case;
#                   the subject-country step reads it.
#   $certFacts      facts for the certificate the scenario is bound to
#   $tngAll         every certificate in the material, for sibling lookups
#   $caFacts        the sibling CA bound by the "caCert is the CA certificate
#                   in the same TLS group" step
#   $dscFacts       the DSC bound by the DSC step
#
# Facts come from describe_cert — the same module the rule engine uses — so a
# step and a rule can never disagree about what a certificate contains.
id: tng-certificate
name: TNG Certificate Governance Steps
description: >
  WHO GDHCN certificate governance verbs. Binding and guard steps select
  certificates via /tng/api/inspect; assertion steps read the resulting facts
  with JsonPointerProcessor and verify them.

steps:
  # ==================================================================
  # BINDING AND GUARDS — these select the subject
  # ==================================================================

  # Load every certificate in the participant material, and bind the first as
  # the default subject. A scenario with a guard rebinds below.
  - match: '^([A-Za-z][A-Za-z0-9_]*) inspects the participant material on ([A-Za-z][A-Za-z0-9_]*) as "([A-Za-z_][A-Za-z0-9_]*)"$'
    actions:
      - declareVariable:
          name: 'tngCountry'
          varType: 'string'
      - assign:
          to: 'tngHeaders{Content-Type}'
          value: '"application/json"'
      - assign:
          to: 'tngHeaders{Accept}'
          value: '"application/json"'
      - assign:
          to: 'inspectTplParams{country}'
          value: '$tngCountry'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'inspectBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"layout\":\"participant\",\"country\":\"${country}\"}'"
            parameters: '$inspectTplParams'
      - send:
          id: 'lastRequest'
          desc: 'Inspect the participant material'
          handler: 'HttpMessagingV2'
          inputs:
            uri: 'concat($$2Base, "/tng/api/inspect")'
            method: '"POST"'
            headers: '$tngHeaders'
            body: '$inspectBody'
      - verify:
          handler: 'NumberValidator'
          desc: 'inspect returned HTTP 200'
          inputs:
            actualnumber: '$lastRequest{response}{status}'
            expectednumber: '"200"'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'tngAll'
          inputs:
            content: '$lastRequest{response}{body}'
            pointer: '"/certificates"'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'certFacts'
          inputs:
            content: '$lastRequest{response}{body}'
            pointer: '"/certificates/0"'

  # Every certificate must sit at <domain>/<group>/<file>. inspect_folder only
  # returns certificates it could place, so a populated group and filename IS
  # the assertion.
  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" should be placed at domain, group and filename$'
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'factGroup'
          inputs:
            content: '$certFacts'
            pointer: '"/group"'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'factFilename'
          inputs:
            content: '$certFacts'
            pointer: '"/filename"'
      - assign:
          to: 'placedParams{group}'
          value: '$factGroup'
      - assign:
          to: 'placedParams{filename}'
          value: '$factFilename'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'isPlaced'
          inputs:
            syntax: '"freemarker"'
            template: "'${(group?has_content && filename?has_content)?c}'"
            parameters: '$placedParams'
      - verify:
          handler: 'StringValidator'
          desc: 'certificate sits at <domain>/<group>/<file> — group and filename are known'
          inputs:
            actualstring: '$isPlaced'
            expectedstring: '"true"'

  # GUARD, as a selector: bind the certificate in <group> whose filename starts
  # with <prefix>. Nothing that fails the guard is bound, so nothing is skipped.
  - match: '^([A-Za-z][A-Za-z0-9_]*) inspects group "([A-Z]+)" file "([A-Za-z0-9_.-]+)" on ([A-Za-z][A-Za-z0-9_]*) as "([A-Za-z_][A-Za-z0-9_]*)"$'
    actions:
      - assign:
          to: 'selectTplParams{country}'
          value: '$tngCountry'
      - assign:
          to: 'selectTplParams{group}'
          value: '"$2"'
      - assign:
          to: 'selectTplParams{filename}'
          value: '"$3"'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'selectBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"layout\":\"participant\",\"country\":\"${country}\",\"group\":\"${group}\",\"filename\":\"${filename}.pem\"}'"
            parameters: '$selectTplParams'
      - send:
          id: 'lastRequest'
          desc: 'Select the certificate this scenario applies to'
          handler: 'HttpMessagingV2'
          inputs:
            uri: 'concat($$4Base, "/tng/api/inspect")'
            method: '"POST"'
            headers: '$tngHeaders'
            body: '$selectBody'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'selectCount'
          inputs:
            content: '$lastRequest{response}{body}'
            pointer: '"/count"'
      - log: 'concat("guard $2/$3 selected ", $selectCount, " certificate(s)")'
      - verify:
          handler: 'NumberValidator'
          desc: 'exactly one certificate matches this role — the scenario is bound to it'
          inputs:
            actualnumber: '$selectCount'
            expectednumber: '"1"'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'certFacts'
          inputs:
            content: '$lastRequest{response}{body}'
            pointer: '"/certificate"'

  # GUARD on group alone.
  - match: '^([A-Za-z][A-Za-z0-9_]*) inspects group "([A-Z]+)" on ([A-Za-z][A-Za-z0-9_]*) as "([A-Za-z_][A-Za-z0-9_]*)"$'
    actions:
      - assign:
          to: 'selectGroupParams{country}'
          value: '$tngCountry'
      - assign:
          to: 'selectGroupParams{group}'
          value: '"$2"'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'selectGroupBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"layout\":\"participant\",\"country\":\"${country}\",\"group\":\"${group}\"}'"
            parameters: '$selectGroupParams'
      - send:
          id: 'lastRequest'
          desc: 'Select the certificates in this group'
          handler: 'HttpMessagingV2'
          inputs:
            uri: 'concat($$3Base, "/tng/api/inspect")'
            method: '"POST"'
            headers: '$tngHeaders'
            body: '$selectGroupBody'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'certFacts'
          inputs:
            content: '$lastRequest{response}{body}'
            pointer: '"/certificate"'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'factGroup'
          inputs:
            content: '$certFacts'
            pointer: '"/group"'
      - verify:
          handler: 'StringValidator'
          desc: 'the material contains exactly one certificate in this group'
          inputs:
            actualstring: '$factGroup'
            expectedstring: '"$2"'

  # Bind the TLS end-entity: group TLS, filename TLS.pem.
  - match: '^([A-Za-z][A-Za-z0-9_]*) inspects the TLS end-entity on ([A-Za-z][A-Za-z0-9_]*) as "([A-Za-z_][A-Za-z0-9_]*)"$'
    actions:
      - assign:
          to: 'tlsSelParams{country}'
          value: '$tngCountry'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'tlsSelBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"layout\":\"participant\",\"country\":\"${country}\",\"group\":\"TLS\",\"filename\":\"TLS.pem\"}'"
            parameters: '$tlsSelParams'
      - send:
          id: 'lastRequest'
          desc: 'Bind the TLS end-entity certificate'
          handler: 'HttpMessagingV2'
          inputs:
            uri: 'concat($$2Base, "/tng/api/inspect")'
            method: '"POST"'
            headers: '$tngHeaders'
            body: '$tlsSelBody'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'certFacts'
          inputs:
            content: '$lastRequest{response}{body}'
            pointer: '"/certificate"'

  # Bind the sibling CA in the same TLS group.
  - match: '^([A-Za-z][A-Za-z0-9_]*) inspects the CA beside it on ([A-Za-z][A-Za-z0-9_]*) as "([A-Za-z_][A-Za-z0-9_]*)"$'
    actions:
      - assign:
          to: 'caSelParams{country}'
          value: '$tngCountry'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'caSelBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"layout\":\"participant\",\"country\":\"${country}\",\"group\":\"TLS\",\"filename\":\"CA.pem\"}'"
            parameters: '$caSelParams'
      - send:
          id: 'lastRequest'
          desc: 'Bind the CA certificate beside it'
          handler: 'HttpMessagingV2'
          inputs:
            uri: 'concat($$2Base, "/tng/api/inspect")'
            method: '"POST"'
            headers: '$tngHeaders'
            body: '$caSelBody'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'caFacts'
          inputs:
            content: '$lastRequest{response}{body}'
            pointer: '"/certificate"'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'caSubject'
          inputs:
            content: '$caFacts'
            pointer: '"/subject/rfc4514"'

  # GUARD: applies only when nothing in the TLS group signs the bound leaf.
  # Bound as a precondition on the issuer/subject comparison below.
  - match: '^no CA in the TLS group verifies "([A-Za-z_][A-Za-z0-9_]*)"$'
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'leafIssuer'
          inputs:
            content: '$certFacts'
            pointer: '"/issuer/rfc4514"'
      - log: 'concat("leaf issuer DN = ", $leafIssuer, " ; sibling CA subject DN = ", $caSubject)'

  # Bind a DSC issued by the named SCA.
  - match: '^([A-Za-z][A-Za-z0-9_]*) inspects the DSC issued by "([A-Za-z_][A-Za-z0-9_]*)" on ([A-Za-z][A-Za-z0-9_]*) as "([A-Za-z_][A-Za-z0-9_]*)"$'
    actions:
      - assign:
          to: 'dscSelParams{country}'
          value: '$tngCountry'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'dscSelBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"layout\":\"participant\",\"country\":\"${country}\",\"group\":\"DSC\"}'"
            parameters: '$dscSelParams'
      - send:
          id: 'lastRequest'
          desc: 'Bind a DSC and its issuing SCA'
          handler: 'HttpMessagingV2'
          inputs:
            uri: 'concat($$3Base, "/tng/api/inspect")'
            method: '"POST"'
            headers: '$tngHeaders'
            body: '$dscSelBody'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'dscFacts'
          inputs:
            content: '$lastRequest{response}{body}'
            pointer: '"/certificate"'

  # ==================================================================
  # KEY STRENGTH
  # ==================================================================

  # Table of | algorithm | minBits |. An algorithm absent from the table FAILS:
  # unlisted is unreviewed, not permitted.
  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" public key should satisfy the minimum size:$'
    table:
      required: [algorithm, minBits]
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'keyAlgorithm'
          inputs:
            content: '$certFacts'
            pointer: '"/publicKey/algorithm"'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'keyBits'
          inputs:
            content: '$certFacts'
            pointer: '"/publicKey/bits"'
      - foreach:
          from: '$tableRows'
          do:
            - assign:
                to: 'minBitsFor{$row.algorithm}'
                value: '"$row.minBits"'
      - assign:
          to: 'requiredBits'
          value: '$minBitsFor{$keyAlgorithm}'
      - assign:
          to: 'listedParams{minBits}'
          value: '$requiredBits'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'algorithmIsListed'
          inputs:
            syntax: '"freemarker"'
            template: "'${(minBits?has_content)?c}'"
            parameters: '$listedParams'
      - verify:
          handler: 'StringValidator'
          desc: 'the key algorithm appears in the minimum-size table (absent = unreviewed = fail)'
          inputs:
            actualstring: '$algorithmIsListed'
            expectedstring: '"true"'
      - assign:
          to: 'bitsParams{actual}'
          value: '$keyBits'
      - assign:
          to: 'bitsParams{minimum}'
          value: '$requiredBits'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'bitsOk'
          inputs:
            syntax: '"freemarker"'
            template: "'${(actual?number >= minimum?number)?c}'"
            parameters: '$bitsParams'
      - log: 'concat("key ", $keyAlgorithm, " ", $keyBits, " bit; minimum ", $requiredBits)'
      - verify:
          handler: 'StringValidator'
          desc: 'public key meets the minimum bit length for its algorithm'
          inputs:
            actualstring: '$bitsOk'
            expectedstring: '"true"'

  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" public key algorithm should be one of "([^"]+)"$'
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'keyAlgorithm'
          inputs:
            content: '$certFacts'
            pointer: '"/publicKey/algorithm"'
      # The allow-list entry may constrain the curve — "EC(P-256)". Compare the
      # algorithm against the leading token of each entry.
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'keyCurve'
          inputs:
            content: '$certFacts'
            pointer: '"/publicKey/curve"'
      - assign:
          to: 'allowParams{allowed}'
          value: '"$2"'
      - assign:
          to: 'allowParams{algorithm}'
          value: '$keyAlgorithm'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'algorithmAllowed'
          inputs:
            syntax: '"freemarker"'
            template: >-
              '<#assign hit = false><#list allowed?split(",") as entry>
              <#if entry?trim?starts_with(algorithm)><#assign hit = true></#if>
              </#list>${hit?c}'
            parameters: '$allowParams'
      - log: 'concat("algorithm ", $keyAlgorithm, " curve ", $keyCurve, " against allow-list $2")'
      - verify:
          handler: 'StringValidator'
          desc: 'public key algorithm is on the allow-list "$2"'
          inputs:
            actualstring: '$algorithmAllowed'
            expectedstring: '"true"'

  # ==================================================================
  # EXTENSIONS, KEY USAGE, EKU
  # ==================================================================

  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" extension "([0-9.]+)" should be present$'
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'extPresent'
          inputs:
            content: '$certFacts'
            pointer: '"/extensionsByOid/$2"'
      # extensionsByOid maps OID -> boolean, so this is a direct comparison.
      - verify:
          handler: 'StringValidator'
          desc: 'extension $2 is present'
          inputs:
            actualstring: '$extPresent'
            expectedstring: '"true"'

  # keyUsage bit names are camelCase as in RFC 5280.
  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" keyUsage "([A-Za-z]+)" should be "(true|false)"$'
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'keyUsageBit'
          inputs:
            content: '$certFacts'
            pointer: '"/keyUsage/$2"'
      - verify:
          handler: 'StringValidator'
          desc: 'keyUsage $2 is $3'
          inputs:
            actualstring: '$keyUsageBit'
            expectedstring: '"$3"'

  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" EKU should include "([0-9.]+)"$'
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'ekuPresent'
          inputs:
            content: '$certFacts'
            pointer: '"/extendedKeyUsageByOid/$2"'
      # extendedKeyUsageByOid maps OID -> boolean.
      - verify:
          handler: 'StringValidator'
          desc: 'extendedKeyUsage includes $2'
          inputs:
            actualstring: '$ekuPresent'
            expectedstring: '"true"'

  # Documentation-only waiver. In the Python dialect this PASSES for the waived
  # groups and SKIPS otherwise. Here the scenario is only ever bound to a waived
  # group, so the step records the waiver rather than asserting anything — it
  # must never read as evidence that a TLS leaf's EKU was checked.
  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" EKU should not be required for groups "([^"]+)"$'
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'factGroup'
          inputs:
            content: '$certFacts'
            pointer: '"/group"'
      - log: 'concat("EKU requirement waived for groups $2 — bound group is ", $factGroup, " (documentation only; asserts nothing)")'

  # ==================================================================
  # BASIC CONSTRAINTS
  # ==================================================================

  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" basicConstraints CA should be "(true|false)"$'
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'bcCa'
          inputs:
            content: '$certFacts'
            pointer: '"/basicConstraints/ca"'
      - verify:
          handler: 'StringValidator'
          desc: 'basicConstraints CA is $2'
          inputs:
            actualstring: '$bcCa'
            expectedstring: '"$2"'

  # Table of | group |. Within TLS the CA file is excluded — it is a CA by
  # definition — which the selector already guarantees here.
  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" basicConstraints CA should be "false" for groups:$'
    table:
      required: [group]
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'factGroup'
          inputs:
            content: '$certFacts'
            pointer: '"/group"'
      - foreach:
          from: '$tableRows'
          do:
            - assign:
                to: 'endEntityGroups{$row.group}'
                value: '"yes"'
      - assign:
          to: 'groupIsEndEntity'
          value: '$endEntityGroups{$factGroup}'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'bcCa'
          inputs:
            content: '$certFacts'
            pointer: '"/basicConstraints/ca"'
      - log: 'concat("group ", $factGroup, " listed as end-entity: ", $groupIsEndEntity, " ; basicConstraints CA = ", $bcCa)'
      - verify:
          handler: 'StringValidator'
          desc: 'an end-entity certificate is not a CA'
          inputs:
            actualstring: '$bcCa'
            expectedstring: '"false"'

  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" basicConstraints pathLen should be "([^"]+)"$'
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'bcPathLenOk'
          inputs:
            content: '$certFacts'
            pointer: '"/basicConstraints/pathLengthOk"'
      - verify:
          handler: 'StringValidator'
          desc: 'basicConstraints pathLen is "$2"'
          inputs:
            actualstring: '$bcPathLenOk'
            expectedstring: '"true"'

  # ==================================================================
  # CHAIN
  # ==================================================================

  # Compares issuer DN against the CA's subject DN. The cryptographic check is
  # tng.cert.chain in the rule engine; both read the same facts.
  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" should be signed by "([A-Za-z_][A-Za-z0-9_]*)"$'
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'leafIssuer'
          inputs:
            content: '$certFacts'
            pointer: '"/issuer/rfc4514"'
      - verify:
          handler: 'StringValidator'
          desc: 'issuer DN of $1 matches the subject DN of $2'
          inputs:
            actualstring: '$leafIssuer'
            expectedstring: '$caSubject'

  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" should be rejected$'
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'leafIssuer'
          inputs:
            content: '$certFacts'
            pointer: '"/issuer/rfc4514"'
      - assign:
          to: 'rejectParams{issuer}'
          value: '$leafIssuer'
      - assign:
          to: 'rejectParams{caSubject}'
          value: '$caSubject'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'nothingSignsIt'
          inputs:
            syntax: '"freemarker"'
            template: "'${(issuer != caSubject)?c}'"
            parameters: '$rejectParams'
      - verify:
          handler: 'StringValidator'
          desc: 'a TLS end-entity that no CA in its group verifies must be rejected'
          inputs:
            actualstring: '$nothingSignsIt'
            expectedstring: '"true"'

  # ==================================================================
  # SUBJECT
  # ==================================================================

  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" subject CN should not be empty$'
    actions:
      # describe_cert already exposes this as a boolean.
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'subjectCnPresent'
          inputs:
            content: '$certFacts'
            pointer: '"/subject/commonNamePresent"'
      - verify:
          handler: 'StringValidator'
          desc: 'subject common name is populated'
          inputs:
            actualstring: '$subjectCnPresent'
            expectedstring: '"true"'

  # The service resolves the subject country to the participant's alpha-3 code,
  # so this compares against $tngCountry rather than the raw subject C.
  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" subject country should be the participant country$'
    actions:
      - assign:
          to: 'countryTplParams{country}'
          value: '$tngCountry'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'certCountry'
          inputs:
            content: '$certFacts'
            pointer: '"/subject/resolvedCountry"'
      - log: 'concat("subject country resolves to ", $certCountry, " ; participant is ", $tngCountry)'
      - verify:
          handler: 'StringValidator'
          desc: 'subject country is the participant country'
          inputs:
            actualstring: '$certCountry'
            expectedstring: '$tngCountry'

  # ==================================================================
  # VALIDITY
  # ==================================================================

  # Table of | group | maxYears |. A group absent from the table is not covered
  # by a limit; the rule engine treats that as "no range applies".
  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" validity should not exceed the limit for its group:$'
    table:
      required: [group, maxYears]
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'factGroup'
          inputs:
            content: '$certFacts'
            pointer: '"/group"'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'validityDays'
          inputs:
            content: '$certFacts'
            pointer: '"/validity/days"'
      - foreach:
          from: '$tableRows'
          do:
            - assign:
                to: 'maxYearsFor{$row.group}'
                value: '"$row.maxYears"'
      - assign:
          to: 'maxYearsHere'
          value: '$maxYearsFor{$factGroup}'
      # Upstream's exact arithmetic: the maximum is < max_years * 366 days, so
      # an SCA may run to 1463 days but not 1464.
      - assign:
          to: 'validityParams{days}'
          value: '$validityDays'
      - assign:
          to: 'validityParams{maxYears}'
          value: '$maxYearsHere'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'validityOk'
          inputs:
            syntax: '"freemarker"'
            template: "'${(days?number < maxYears?number * 366)?c}'"
            parameters: '$validityParams'
      - log: 'concat("group ", $factGroup, " limit ", $maxYearsHere, " years; actual ", $validityDays, " days")'
      - verify:
          handler: 'StringValidator'
          desc: 'validity is within the limit for the group'
          inputs:
            actualstring: '$validityOk'
            expectedstring: '"true"'

  - match: '^"([A-Za-z_][A-Za-z0-9_]*)" notAfter should not exceed "([A-Za-z_][A-Za-z0-9_]*)" notAfter$'
    actions:
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'dscNotAfter'
          inputs:
            content: '$dscFacts'
            pointer: '"/validity/notAfter"'
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'scaNotAfter'
          inputs:
            content: '$certFacts'
            pointer: '"/validity/notAfter"'
      - log: 'concat("DSC notAfter ", $dscNotAfter, " ; SCA notAfter ", $scaNotAfter)'
      # ISO-8601 UTC timestamps sort lexicographically, so a string comparison
      # is a date comparison here.
      - assign:
          to: 'nestParams{dsc}'
          value: '$dscNotAfter'
      - assign:
          to: 'nestParams{sca}'
          value: '$scaNotAfter'
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'nestingOk'
          inputs:
            syntax: '"freemarker"'
            template: "'${(dsc <= sca)?c}'"
            parameters: '$nestParams'
      - verify:
          handler: 'StringValidator'
          desc: 'an issued certificate does not outlive its issuer'
          inputs:
            actualstring: '$nestingOk'
            expectedstring: '"true"'
