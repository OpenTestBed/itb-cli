# TNG Certificate Governance dialect — generation 2
#
# The 23 certificate-governance checks specified in
# tng-participant-DEV-XXR/tng_certificate_dialect.py, one to one. Facts come
# from POST /tng/api/inspect (describe_cert, the module the rule engine also
# uses), so a step and a rule cannot disagree about a certificate.
#
#   kind   tng-validator            "TNGValidator is a tng-validator at …"
#   type   x509:Certificate         the inspect facts; read with "/…" pointers
#
#   set $tngCountry to "XXR"                       the participant's ISO-3166 alpha-3
#   Participant inspects the participant material on TNGValidator as $cert
#   Participant inspects group "TLS" file "TLS" on TNGValidator as $cert
#   Participant inspects group "SCA" on TNGValidator as $cert
#   Participant inspects the TLS end-entity on TNGValidator as $tlsCert
#   Participant inspects the CA beside it on TNGValidator as $caCert
#   Participant inspects the DSC issued by $sca on TNGValidator as $dsc
#   $cert keyUsage "digitalSignature" should be true
#   $cert at "/keyUsage/digitalSignature" should be true      (same thing, core path form)
#
# A guard is a SELECTOR, not a filter: the binding step asks /inspect for the
# certificates it describes, so nothing that fails the guard is ever bound and
# nothing needs skipping. SKIPPED is never reported as PASSED.
id: tng-certificate
name: TNG Certificate Governance Steps
language: 2
description: >
  WHO GDHCN certificate governance verbs: key strength, keyUsage,
  extendedKeyUsage, basicConstraints, chain, subject and validity.

kinds: [tng-validator]

types:
  x509:Certificate:
    name: X.509 certificate

x-json: &json
  - assign: { to: 'tngHeaders{Content-Type}', value: '"application/json"' }
  - assign: { to: 'tngHeaders{Accept}', value: '"application/json"' }

verbs:
  # ==================================================================
  # BINDING AND GUARDS — these select the subject
  # ==================================================================
  - text: '{actor} inspects the participant material( on {actor:tng-validator})? as {var}'
    doc: Inspect every certificate in the participant material; bind the first as the subject.
    output: { type: 'x509:Certificate' }
    actions:
      - declareVariable: { name: 'tngCountry', varType: 'string' }
      - *json
      - assign: { to: 'inspectTplParams{country}', value: '$tngCountry' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'inspectBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"layout\":\"participant\",\"country\":\"${country}\"}'"
            parameters: '$inspectTplParams'
      - send:
          id: 'lastRequest'
          desc: 'Inspect the participant material'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/tng/api/inspect")'
            method: '"POST"'
            headers: '$tngHeaders'
            body: '$inspectBody'
      - verify:
          handler: 'NumberValidator'
          desc: 'inspect returned HTTP 200'
          inputs: { actualnumber: '$lastRequest{response}{status}', expectednumber: '"200"' }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'tngAll', inputs: { content: '$lastRequest{response}{body}', pointer: '"/certificates"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: '$3',     inputs: { content: '$lastRequest{response}{body}', pointer: '"/certificates/0"' } }

  # inspect_folder only returns certificates it could place, so a populated
  # group and filename IS the assertion.
  - text: '{ref} should be placed at domain, group and filename'
    doc: The certificate sits at <domain>/<group>/<file>.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'factGroup',    inputs: { content: '$1', pointer: '"/group"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'factFilename', inputs: { content: '$1', pointer: '"/filename"' } }
      - assign: { to: 'placedParams{group}', value: '$factGroup' }
      - assign: { to: 'placedParams{filename}', value: '$factFilename' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'isPlaced'
          inputs:
            syntax: '"freemarker"'
            template: "'${(group?has_content && filename?has_content)?c}'"
            parameters: '$placedParams'
      - verify:
          handler: 'StringValidator'
          desc: '$$1 sits at <domain>/<group>/<file> — group and filename are known'
          inputs: { actualstring: '$isPlaced', expectedstring: '"true"' }

  - text: '{actor} inspects group {string} file {string}( on {actor:tng-validator})? as {var}'
    doc: Bind the one certificate in a group whose filename starts with the prefix.
    output: { type: 'x509:Certificate' }
    actions:
      - *json
      - assign: { to: 'selectTplParams{country}', value: '$tngCountry' }
      - assign: { to: 'selectTplParams{group}', value: '"$2"' }
      - assign: { to: 'selectTplParams{filename}', value: '"$3"' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'selectBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"layout\":\"participant\",\"country\":\"${country}\",\"group\":\"${group}\",\"filename\":\"${filename}.pem\"}'"
            parameters: '$selectTplParams'
      - send:
          id: 'lastRequest'
          desc: 'Select the certificate this scenario applies to'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/tng/api/inspect")'
            method: '"POST"'
            headers: '$tngHeaders'
            body: '$selectBody'
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'selectCount', inputs: { content: '$lastRequest{response}{body}', pointer: '"/count"' } }
      - log: 'concat("guard $2/$3 selected ", $selectCount, " certificate(s)")'
      - verify:
          handler: 'NumberValidator'
          desc: 'exactly one certificate matches this role — the scenario is bound to it'
          inputs: { actualnumber: '$selectCount', expectednumber: '"1"' }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: '$5', inputs: { content: '$lastRequest{response}{body}', pointer: '"/certificate"' } }

  - text: '{actor} inspects group {string}( on {actor:tng-validator})? as {var}'
    doc: Bind the one certificate in a group.
    output: { type: 'x509:Certificate' }
    actions:
      - *json
      - assign: { to: 'selectGroupParams{country}', value: '$tngCountry' }
      - assign: { to: 'selectGroupParams{group}', value: '"$2"' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'selectGroupBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"layout\":\"participant\",\"country\":\"${country}\",\"group\":\"${group}\"}'"
            parameters: '$selectGroupParams'
      - send:
          id: 'lastRequest'
          desc: 'Select the certificates in this group'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/tng/api/inspect")'
            method: '"POST"'
            headers: '$tngHeaders'
            body: '$selectGroupBody'
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: '$4',        inputs: { content: '$lastRequest{response}{body}', pointer: '"/certificate"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'factGroup', inputs: { content: '$4', pointer: '"/group"' } }
      - verify:
          handler: 'StringValidator'
          desc: 'the material contains exactly one certificate in group $2'
          inputs: { actualstring: '$factGroup', expectedstring: '"$2"' }

  - text: '{actor} inspects the TLS end-entity( on {actor:tng-validator})? as {var}'
    doc: Bind the TLS end-entity (group TLS, file TLS.pem).
    output: { type: 'x509:Certificate' }
    actions:
      - *json
      - assign: { to: 'tlsSelParams{country}', value: '$tngCountry' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'tlsSelBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"layout\":\"participant\",\"country\":\"${country}\",\"group\":\"TLS\",\"filename\":\"TLS.pem\"}'"
            parameters: '$tlsSelParams'
      - send:
          id: 'lastRequest'
          desc: 'Bind the TLS end-entity certificate'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/tng/api/inspect")'
            method: '"POST"'
            headers: '$tngHeaders'
            body: '$tlsSelBody'
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: '$3', inputs: { content: '$lastRequest{response}{body}', pointer: '"/certificate"' } }

  - text: '{actor} inspects the CA beside it( on {actor:tng-validator})? as {var}'
    doc: Bind the CA in the same TLS group (file CA.pem).
    output: { type: 'x509:Certificate' }
    actions:
      - *json
      - assign: { to: 'caSelParams{country}', value: '$tngCountry' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'caSelBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"layout\":\"participant\",\"country\":\"${country}\",\"group\":\"TLS\",\"filename\":\"CA.pem\"}'"
            parameters: '$caSelParams'
      - send:
          id: 'lastRequest'
          desc: 'Bind the CA certificate beside it'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/tng/api/inspect")'
            method: '"POST"'
            headers: '$tngHeaders'
            body: '$caSelBody'
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: '$3', inputs: { content: '$lastRequest{response}{body}', pointer: '"/certificate"' } }

  - text: 'no CA in the TLS group verifies {ref}'
    doc: Guard for the rejection case; records the issuer DN for the comparison that follows.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'leafIssuer', inputs: { content: '$1', pointer: '"/issuer/rfc4514"' } }
      - log: 'concat("leaf issuer DN = ", $leafIssuer)'

  - text: '{actor} inspects the DSC issued by {ref}( on {actor:tng-validator})? as {var}'
    doc: Bind a DSC issued by the named SCA.
    output: { type: 'x509:Certificate' }
    actions:
      - *json
      - assign: { to: 'dscSelParams{country}', value: '$tngCountry' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'dscSelBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{\"layout\":\"participant\",\"country\":\"${country}\",\"group\":\"DSC\"}'"
            parameters: '$dscSelParams'
      - send:
          id: 'lastRequest'
          desc: 'Bind a DSC and its issuing SCA'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/tng/api/inspect")'
            method: '"POST"'
            headers: '$tngHeaders'
            body: '$dscSelBody'
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: '$4', inputs: { content: '$lastRequest{response}{body}', pointer: '"/certificate"' } }

  # ==================================================================
  # KEY STRENGTH
  # ==================================================================
  # | algorithm | minBits |. An algorithm absent from the table FAILS:
  # unlisted is unreviewed, not permitted.
  - text: '{ref} public key should satisfy the minimum size:'
    doc: The key meets the minimum bit length for its algorithm (table | algorithm | minBits |).
    table:
      required: [algorithm, minBits]
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'keyAlgorithm', inputs: { content: '$1', pointer: '"/publicKey/algorithm"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'keyBits',      inputs: { content: '$1', pointer: '"/publicKey/bits"' } }
      - foreach:
          from: '$tableRows'
          do:
            - assign: { to: 'minBitsFor{$row.algorithm}', value: '"$row.minBits"' }
      - assign: { to: 'requiredBits', value: '$minBitsFor{$keyAlgorithm}' }
      - assign: { to: 'listedParams{minBits}', value: '$requiredBits' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'algorithmIsListed'
          inputs:
            syntax: '"freemarker"'
            template: "'${(minBits?has_content)?c}'"
            parameters: '$listedParams'
      - verify:
          handler: 'StringValidator'
          desc: 'the key algorithm appears in the minimum-size table (absent = unreviewed = fail)'
          inputs: { actualstring: '$algorithmIsListed', expectedstring: '"true"' }
      - assign: { to: 'bitsParams{actual}', value: '$keyBits' }
      - assign: { to: 'bitsParams{minimum}', value: '$requiredBits' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'bitsOk'
          inputs:
            syntax: '"freemarker"'
            template: "'${(actual?number >= minimum?number)?c}'"
            parameters: '$bitsParams'
      - log: 'concat("key ", $keyAlgorithm, " ", $keyBits, " bit; minimum ", $requiredBits)'
      - verify:
          handler: 'StringValidator'
          desc: 'public key meets the minimum bit length for its algorithm'
          inputs: { actualstring: '$bitsOk', expectedstring: '"true"' }

  - text: '{ref} public key algorithm should be one of {string}'
    doc: The key algorithm is on the allow-list (entries may name a curve, "EC(P-256)").
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'keyAlgorithm', inputs: { content: '$1', pointer: '"/publicKey/algorithm"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'keyCurve',     inputs: { content: '$1', pointer: '"/publicKey/curve"' } }
      - assign: { to: 'allowParams{allowed}', value: '"$2"' }
      - assign: { to: 'allowParams{algorithm}', value: '$keyAlgorithm' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'algorithmAllowed'
          inputs:
            syntax: '"freemarker"'
            template: >-
              '<#assign hit = false><#list allowed?split(",") as entry>
              <#if entry?trim?starts_with(algorithm)><#assign hit = true></#if>
              </#list>${hit?c}'
            parameters: '$allowParams'
      - log: 'concat("algorithm ", $keyAlgorithm, " curve ", $keyCurve, " against allow-list $2")'
      - verify:
          handler: 'StringValidator'
          desc: 'public key algorithm is on the allow-list "$2"'
          inputs: { actualstring: '$algorithmAllowed', expectedstring: '"true"' }

  # ==================================================================
  # EXTENSIONS, KEY USAGE, EKU
  # ==================================================================
  - text: '{ref} extension {string} should be present'
    doc: The extension with this OID is present.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'extPresent', inputs: { content: '$1', pointer: '"/extensionsByOid/$2"' } }
      - verify:
          handler: 'StringValidator'
          desc: 'extension $2 is present'
          inputs: { actualstring: '$extPresent', expectedstring: '"true"' }

  - text: '{ref} keyUsage {string} should be {value}'
    doc: A keyUsage bit (RFC 5280 camelCase name) is true or false.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'keyUsageBit', inputs: { content: '$1', pointer: '"/keyUsage/$2"' } }
      - verify:
          handler: 'StringValidator'
          desc: 'keyUsage $2 is $3.raw'
          inputs: { actualstring: '$keyUsageBit', expectedstring: '$3' }

  - text: '{ref} EKU should include {string}'
    doc: extendedKeyUsage includes this OID.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'ekuPresent', inputs: { content: '$1', pointer: '"/extendedKeyUsageByOid/$2"' } }
      - verify:
          handler: 'StringValidator'
          desc: 'extendedKeyUsage includes $2'
          inputs: { actualstring: '$ekuPresent', expectedstring: '"true"' }

  # Documentation-only waiver: the scenario is only ever bound to a waived
  # group, so this records the waiver and asserts nothing.
  - text: '{ref} EKU should not be required for groups {string}'
    doc: Records that EKU is waived for these groups (asserts nothing).
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'factGroup', inputs: { content: '$1', pointer: '"/group"' } }
      - log: 'concat("EKU requirement waived for groups $2 — bound group is ", $factGroup, " (documentation only; asserts nothing)")'

  # ==================================================================
  # BASIC CONSTRAINTS
  # ==================================================================
  - text: '{ref} basicConstraints CA should be {value} for groups:'
    doc: CA flag for the certificate's group, from a | group | table (within TLS the CA file is excluded by the selector).
    table:
      required: [group]
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'factGroup', inputs: { content: '$1', pointer: '"/group"' } }
      - foreach:
          from: '$tableRows'
          do:
            - assign: { to: 'listedGroups{$row.group}', value: '"yes"' }
      - assign: { to: 'groupIsListed', value: '$listedGroups{$factGroup}' }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'bcCa', inputs: { content: '$1', pointer: '"/basicConstraints/ca"' } }
      - log: 'concat("group ", $factGroup, " listed: ", $groupIsListed, " ; basicConstraints CA = ", $bcCa)'
      - verify:
          handler: 'StringValidator'
          desc: 'basicConstraints CA is $2.raw for the listed groups'
          inputs: { actualstring: '$bcCa', expectedstring: '$2' }

  - text: '{ref} basicConstraints CA should be {value}'
    doc: The CA flag of basicConstraints.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'bcCa', inputs: { content: '$1', pointer: '"/basicConstraints/ca"' } }
      - verify:
          handler: 'StringValidator'
          desc: 'basicConstraints CA is $2.raw'
          inputs: { actualstring: '$bcCa', expectedstring: '$2' }

  - text: '{ref} basicConstraints pathLen should be {string}'
    doc: pathLen is within the rule ("0 or absent").
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'bcPathLenOk', inputs: { content: '$1', pointer: '"/basicConstraints/pathLengthOk"' } }
      - verify:
          handler: 'StringValidator'
          desc: 'basicConstraints pathLen is "$2"'
          inputs: { actualstring: '$bcPathLenOk', expectedstring: '"true"' }

  # ==================================================================
  # CHAIN
  # ==================================================================
  # Compares issuer DN against the CA's subject DN; the cryptographic check is
  # tng.cert.chain in the rule engine — both read the same facts.
  - text: '{ref} should be signed by {ref}'
    doc: The first certificate's issuer DN is the second's subject DN.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'leafIssuer', inputs: { content: '$1', pointer: '"/issuer/rfc4514"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'caSubject',  inputs: { content: '$2', pointer: '"/subject/rfc4514"' } }
      - verify:
          handler: 'StringValidator'
          desc: 'issuer DN of $$1 matches the subject DN of $2.raw'
          inputs: { actualstring: '$leafIssuer', expectedstring: '$caSubject' }

  - text: '{ref} should be rejected by {ref}'
    doc: The first certificate is NOT issued by the second (issuer DN differs).
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'leafIssuer', inputs: { content: '$1', pointer: '"/issuer/rfc4514"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'caSubject',  inputs: { content: '$2', pointer: '"/subject/rfc4514"' } }
      - assign: { to: 'rejectParams{issuer}', value: '$leafIssuer' }
      - assign: { to: 'rejectParams{caSubject}', value: '$caSubject' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'nothingSignsIt'
          inputs:
            syntax: '"freemarker"'
            template: "'${(issuer != caSubject)?c}'"
            parameters: '$rejectParams'
      - verify:
          handler: 'StringValidator'
          desc: 'a TLS end-entity that no CA in its group verifies must be rejected'
          inputs: { actualstring: '$nothingSignsIt', expectedstring: '"true"' }

  # ==================================================================
  # SUBJECT
  # ==================================================================
  - text: '{ref} subject CN should not be empty'
    doc: The subject common name is populated.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'subjectCnPresent', inputs: { content: '$1', pointer: '"/subject/commonNamePresent"' } }
      - verify:
          handler: 'StringValidator'
          desc: 'subject common name is populated'
          inputs: { actualstring: '$subjectCnPresent', expectedstring: '"true"' }

  # The service resolves the subject country to the participant's alpha-3,
  # so this compares against $tngCountry rather than the raw subject C.
  - text: '{ref} subject country should be the participant country'
    doc: The subject country resolves to $tngCountry.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'certCountry', inputs: { content: '$1', pointer: '"/subject/resolvedCountry"' } }
      - log: 'concat("subject country resolves to ", $certCountry, " ; participant is ", $tngCountry)'
      - verify:
          handler: 'StringValidator'
          desc: 'subject country is the participant country'
          inputs: { actualstring: '$certCountry', expectedstring: '$tngCountry' }

  # ==================================================================
  # VALIDITY
  # ==================================================================
  # | group | maxYears |. Upstream's arithmetic: days < maxYears * 366.
  - text: '{ref} validity should not exceed the limit for its group:'
    doc: Validity in days is under the limit for the certificate's group (table | group | maxYears |).
    table:
      required: [group, maxYears]
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'factGroup',    inputs: { content: '$1', pointer: '"/group"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'validityDays', inputs: { content: '$1', pointer: '"/validity/days"' } }
      - foreach:
          from: '$tableRows'
          do:
            - assign: { to: 'maxYearsFor{$row.group}', value: '"$row.maxYears"' }
      - assign: { to: 'maxYearsHere', value: '$maxYearsFor{$factGroup}' }
      - assign: { to: 'validityParams{days}', value: '$validityDays' }
      - assign: { to: 'validityParams{maxYears}', value: '$maxYearsHere' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'validityOk'
          inputs:
            syntax: '"freemarker"'
            template: "'${(days?number < maxYears?number * 366)?c}'"
            parameters: '$validityParams'
      - log: 'concat("group ", $factGroup, " limit ", $maxYearsHere, " years; actual ", $validityDays, " days")'
      - verify:
          handler: 'StringValidator'
          desc: 'validity is within the limit for the group'
          inputs: { actualstring: '$validityOk', expectedstring: '"true"' }

  # ISO-8601 UTC timestamps sort lexicographically, so a string comparison is a date comparison.
  - text: '{ref} notAfter should not exceed {ref} notAfter'
    doc: An issued certificate does not outlive its issuer.
    actions:
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'issuedNotAfter', inputs: { content: '$1', pointer: '"/validity/notAfter"' } }
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'issuerNotAfter', inputs: { content: '$2', pointer: '"/validity/notAfter"' } }
      - log: 'concat("$1.raw notAfter ", $issuedNotAfter, " ; $2.raw notAfter ", $issuerNotAfter)'
      - assign: { to: 'nestParams{issued}', value: '$issuedNotAfter' }
      - assign: { to: 'nestParams{issuer}', value: '$issuerNotAfter' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'nestingOk'
          inputs:
            syntax: '"freemarker"'
            template: "'${(issued <= issuer)?c}'"
            parameters: '$nestParams'
      - verify:
          handler: 'StringValidator'
          desc: 'an issued certificate does not outlive its issuer'
          inputs: { actualstring: '$nestingOk', expectedstring: '"true"' }
