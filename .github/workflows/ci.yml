name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test
      # The golden corpus is the regression net for the compiler: 39 real
      # feature files compiled and compared byte for byte against snapshots
      # taken before the parser was extracted. It is self-contained, so it
      # needs no checkout beside this one.
      - name: golden corpus (package implementation)
        run: npm test --workspace packages/gherkin
      # ...and the same snapshots replayed through the CLI adapter, which is
      # the path the `otb` command actually takes.
      - name: golden corpus (CLI adapter)
        run: npm test --workspace packages/gherkin
        env:
          CORPUS_IMPL: ../../../src/compile.mjs
          # Absolute: npm runs a workspace script with the CWD set to that
          # workspace, so a repo-relative path would resolve under
          # packages/gherkin and find nothing.
          ITB_ASSET_ROOT: ${{ github.workspace }}/packages/gherkin/test/corpus
      # test/e2e.mjs deploys to a RUNNING ITB and needs itb-suite.config.yaml
      # with live API keys. That file is gitignored (it holds secrets), so on a
      # runner the script always takes its skip path and exits 2 — a code it
      # uses deliberately to mean "could not run", distinct from 1 = failed.
      # Bare `npm run e2e` turned that skip into a red build, so the job could
      # never go green. Honour the contract: 2 is a skip, anything else stands.
      # The default shell is `bash -e`, hence `|| code=$?` rather than a bare
      # call — otherwise the step aborts before the exit code can be read.
      - name: e2e — boot itb-starter, add fhir-validator, assert green smoke
        run: |
          code=0
          npm run e2e || code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice::e2e skipped — no itb-suite.config.yaml (needs a live ITB instance and API keys)"
            exit 0
          fi
          exit "$code"
